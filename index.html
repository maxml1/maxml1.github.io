<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Under Maintenance</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.25);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1.5rem;
      line-height: 1.6;
    }

    .container {
      background-color: var(--card-bg);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 3rem 2.5rem;
      max-width: 520px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(56, 189, 248, 0.1);
      color: var(--accent);
      border: 1px solid rgba(56, 189, 248, 0.2);
      padding: 6px 14px;
      border-radius: 9999px;
      font-size: 0.875rem;
      font-weight: 500;
      margin-bottom: 1.5rem;
    }

    .pulse-dot {
      width: 8px;
      height: 8px;
      background-color: var(--accent);
      border-radius: 50%;
      box-shadow: 0 0 0 0 var(--accent-glow);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% {
        transform: scale(0.95);
        box-shadow: 0 0 0 0 rgba(56, 189, 248, 0.7);
      }
      70% {
        transform: scale(1);
        box-shadow: 0 0 0 8px rgba(56, 189, 248, 0);
      }
      100% {
        transform: scale(0.95);
        box-shadow: 0 0 0 0 rgba(56, 189, 248, 0);
      }
    }

    h1 {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.025em;
      margin-bottom: 0.75rem;
      color: var(--text-main);
    }

    p {
      color: var(--text-muted);
      font-size: 1rem;
      margin-bottom: 2rem;
    }

    .details-box {
      background: rgba(15, 23, 42, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 8px;
      padding: 1rem;
      font-size: 0.875rem;
      color: var(--text-muted);
    }

    .details-box strong {
      color: var(--text-main);
    }
	
	.preview-btn {
    display: inline-block;
    padding: 10px 20px;
    font-family: sans-serif;
    font-size: 16px;
    font-weight: 600;
    color: #ffffff;
    background-color: #0066cc;
    text-decoration: none;
    border-radius: 6px;
    transition: background-color 0.2s ease;
  }

  .preview-btn:hover {
    background-color: #004999;
  }
	
  </style>
</head>
<body>
  <div class="container">
    <div class="status-badge">
      <span class="pulse-dot"></span>
      Scheduled Maintenance
    </div>
    
    <h1>We’ll be right back</h1>
    
    <p>
      Our website is currently undergoing brief hardware maintenance to keep things running smoothly. We appreciate your patience!<div>
	  <a href="https://web.archive.org/web/20260515010540/https://www.490th.co.uk/" class="preview-btn" target="_blank" rel="noopener noreferrer">View Preview</a>
    </p>

    <div class="details-box">
      Expected downtime: <strong>Temporary</strong>
    </div>
  </div>
</body>
</html>
